<!-- 
    DOF algorithm from http://www.nutty.ca/?page_id=352&link=depth_of_field
 -->
<body>
<canvas id="webgpu-canvas"></canvas>
<div id="stats">
    <div id="device-info"></div>
    <div>
        CPU Frame Time: <span id="cpu-time"></span>
    </div>
    <div>
        GPU Draw Time: <span id="draw-time"></span>
    </div>
     <div>
        GPU DOF Time: <span id="dof-time"></span>
    </div>
</div>
<script type="module">
import { checkSupport, addDescription, loadImageBitmaps, createCube, xformMatrix, randomRange, getMipLevelCount, generate2DMipmap, parseAdapterInfo, createQuad } from "./utils/utils.js";
import { Timer } from "./utils/Timer.js";

const { mat4, vec3 } = glMatrix;

checkSupport();
addDescription(
    "Depth of Field",
    "Simulate camera focus effects in screen space.",
    "dof.html"
);

(async () => {
    const FOV = Math.PI / 2;
    const NEAR = 0.1;
    const FAR = 20;
    const NUM_ROWS = 20;
    const BOXES_PER_ROW = 5;
    const NUM_BOXES = BOXES_PER_ROW * NUM_ROWS;

    //////////////////////////////////////////
    // Set up WebGPU adapter, load
    // texture image
    //////////////////////////////////////////

    const [adapter, [image]] = await Promise.all([
        navigator.gpu.requestAdapter(),
        loadImageBitmaps(["img/webgpu.png"])
    ]);

    const presentationFormat = navigator.gpu.getPreferredCanvasFormat();

    ////////////////////////////////////
    // Set up device and canvas context
    ////////////////////////////////////

    const device = await adapter.requestDevice({
        requiredFeatures: adapter.features.has("timestamp-query") ? ["timestamp-query"] : []
    });
    
    const canvas = document.getElementById("webgpu-canvas");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const context = canvas.getContext("webgpu");
    context.configure({
        device,
        format: presentationFormat
    });

    document.getElementById("device-info").innerText = parseAdapterInfo(adapter.info);

    const timer = new Timer(device);

    const cpuTimeDisplay = document.getElementById("cpu-time");
    const drawTimeDisplay = document.getElementById("draw-time");
    const dofTimeDisplay = document.getElementById("dof-time");
    
    ////////////////////////////////////////
    // Create vertex buffers and load data
    ////////////////////////////////////////

    const cubeData = createCube();
    const numVertices = cubeData.positions.length / 3;

    const positionBuffer = device.createBuffer({
        size: cubeData.positions.byteLength,
        usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST
    });
    const normalBuffer = device.createBuffer({
        size: cubeData.normals.byteLength,
        usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST
    });
    const uvBuffer = device.createBuffer({
        size: cubeData.uvs.byteLength,
        usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST
    });

    device.queue.writeBuffer(positionBuffer, 0, cubeData.positions);
    device.queue.writeBuffer(normalBuffer, 0, cubeData.normals);
    device.queue.writeBuffer(uvBuffer, 0, cubeData.uvs);

    const quadData = createQuad();

    const quad = {
        positions: device.createBuffer({
            size: quadData.positions.byteLength,
            usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST
        }),
        count: quadData.positions.length / 2
    };
    

    device.queue.writeBuffer(quad.positions, 0, quadData.positions);
    
    /////////////////////////////////////////
    // Create texture, sampler and load data
    //////////////////////////////////////////

    const sampler = device.createSampler({
        minFilter: "linear",
        magFilter: "linear",
        mipmapFilter: "linear"
    });

    const texture = device.createTexture({
        size: [image.width, image.height],
        format: "rgba8unorm",
        mipLevelCount: getMipLevelCount(image.width, image.height),
        usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT
    });

    device.queue.copyExternalImageToTexture(
        { source: image, flipY: true },
        { texture },
        {
            width: image.width,
            height: image.height
        }
    );

    generate2DMipmap(device, texture);

     ///////////////////////
    // Draw uniform values
    ////////////////////////

    let projectionMatrix = mat4.create();
    mat4.perspectiveZO(projectionMatrix, FOV, canvas.width / canvas.height, NEAR, FAR);

    let viewMatrix = mat4.create();
    let eyePosition = vec3.fromValues(0, 2, 1);
    mat4.lookAt(viewMatrix, eyePosition, vec3.fromValues(0, 0, -2), vec3.fromValues(0, 1, 0));

    let lightPosition = vec3.fromValues(1, 1, 0.5);  

    ///////////////////
    // Draw pipeline
    ///////////////////

    // MSAA draw color render target.
    let msaaTexture = device.createTexture({
        label: 'msaa texture',
        size: [canvas.width, canvas.height],
        format: "rgba8unorm",
        usage: GPUTextureUsage.RENDER_ATTACHMENT,
        sampleCount: 4
    });

    // Single-sample draw color render target for resolve.
    let colorResolveTexture = device.createTexture({
        label: 'color resolve texture',
        size: [canvas.width, canvas.height],
        format: "rgba8unorm",
        usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING,
    });

    // MSAA view space depth output from draw shader.
    let linearDepthTexture = device.createTexture({
        label: 'linear depth texture',
        size: [canvas.width, canvas.height],
        format: "r16float",
        usage: GPUTextureUsage.RENDER_ATTACHMENT,
        sampleCount: 4
    });

    // Single-sample view space depth for resolve.
    let linearDepthResolveTexture = device.createTexture({
        label: 'linear depth resolve texture',
        size: [canvas.width, canvas.height],
        format: "r16float",
        usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING,
    });

    // Draw depth texture for depth testing.
    let drawDepthTexture = device.createTexture({
        size: [canvas.width, canvas.height],
        format: "depth24plus",
        usage:  GPUTextureUsage.RENDER_ATTACHMENT,
        sampleCount: 4
    });

    // Scene uniforms that are only set once.
    const sceneUniformBuffer = device.createBuffer({
        size: 160,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
    });

    device.queue.writeBuffer(sceneUniformBuffer, 0, viewMatrix);
    device.queue.writeBuffer(sceneUniformBuffer, 64, projectionMatrix);
    device.queue.writeBuffer(sceneUniformBuffer, 128, eyePosition);
    device.queue.writeBuffer(sceneUniformBuffer, 144, lightPosition);

    // Draw shader explicitly outputs view space depth so it 
    // can resolve and be used in dof postprocessing.
    const drawShaderModule = device.createShaderModule({
        code: `

            struct SceneUniforms {
                viewMatrix: mat4x4f,
                projMatrix: mat4x4f,
                eyePosition: vec4f,
                lightPosition: vec4f
            };

            struct ObjectUniforms {
                worldMatrix: mat4x4f,
            };

            struct VSOut {
                @builtin(position) clipPosition: vec4f,
                @location(0) worldPosition: vec3f,
                @location(1) normal: vec3f,
                @location(2) uv: vec2f,
                @location(3) depth: f32
            };

            @group(0) @binding(0) var<uniform> sceneUniforms: SceneUniforms;
            @group(0) @binding(1) var<uniform> objectUniforms: ObjectUniforms;

            @vertex
            fn vs(
                @location(0) position: vec4f,
                @location(1) normal: vec3f,
                @location(2) uv: vec2f,
            ) -> VSOut {
                let worldPosition: vec4f = objectUniforms.worldMatrix * position;
                let viewPosition: vec4f = sceneUniforms.viewMatrix * worldPosition;

                var vsOut: VSOut;
                vsOut.clipPosition = sceneUniforms.projMatrix * viewPosition;
                vsOut.worldPosition = worldPosition.xyz;
                vsOut.normal = (objectUniforms.worldMatrix * vec4f(normal, 0.0)).xyz;
                vsOut.uv = uv;
                vsOut.depth = -viewPosition.z;

                return vsOut;
            }

            struct FSOut {
                @location(0) color: vec4f,
                @location(1) depth: f32,
            }
            

            @group(0) @binding(2) var textureSampler: sampler;
            @group(0) @binding(3) var textureData: texture_2d<f32>;

            @fragment
            fn fs(fsIn: VSOut) -> FSOut {
                let surfaceColor: vec3f = textureSample(textureData, textureSampler, fsIn.uv).rgb;

                let normal: vec3f = normalize(fsIn.normal);
                let eyeVec: vec3f = normalize(sceneUniforms.eyePosition.xyz - fsIn.worldPosition);
                let incidentVec: vec3f = normalize(fsIn.worldPosition - sceneUniforms.lightPosition.xyz);
                let lightVec: vec3f = -incidentVec;
                let diffuse: f32 = max(dot(lightVec, normal), 0.0);
                let highlight: f32 = pow(max(dot(eyeVec, reflect(incidentVec, normal)), 0.0), 100.0);
                let ambient: f32 = 0.1;
                let color = vec4f(surfaceColor * (diffuse + highlight + ambient), 1.0);

                var fsOut: FSOut;
                fsOut.color = color;
                fsOut.depth = fsIn.depth;
                return fsOut;
            }

        `
    });

    const drawPipeline = device.createRenderPipeline({
        layout: 'auto',
        vertex: {
            module: drawShaderModule,
            entryPoint: "vs",
            buffers: [
                {
                    arrayStride: 12,
                    attributes: [{
                        shaderLocation: 0,
                        format: "float32x3",
                        offset: 0
                    }]
                },
                {
                    arrayStride: 12,
                    attributes: [{
                        shaderLocation: 1,
                        format: "float32x3",
                        offset: 0
                    }]
                },
                {
                    arrayStride: 8,
                    attributes: [{
                        shaderLocation: 2,
                        format: "float32x2",
                        offset: 0
                    }]
                }
            ]
        },
        fragment: {
            module: drawShaderModule,
            entryPoint: "fs",
            targets: [
                {
                    format: "rgba8unorm"
                },
                {
                    format: "r16float"
                }
            ]
        },
        multisample: {
            count: 4
        },
        primitive: {
            topology: "triangle-list",
            cullMode: "back"
        },
        depthStencil: {
            format: "depth24plus",
            depthWriteEnabled: true,
            depthCompare: "less"
        }
    });

    //////////////////////////////////////////////////////
    // DOF Pipeline
    // Pass 1: Input resolved draw color and depth,
    //     perform horizontal blur, output to offscreen
    //     texture.
    // Pass 2: Input horizontal blur color and draw depth,
    //     perform vertical blur, output to canvas.
    //////////////////////////////////////////////////////

    // DOF parameters
    const FOCAL_LENGTH = 1.5;
    const FOCUS_DISTANCE = 3.0;
    const MAGNIFICATION = FOCAL_LENGTH / Math.abs(FOCUS_DISTANCE - FOCAL_LENGTH);
    const FSTOP = 2.8;
    const BLUR_COEFFICIENT = FOCAL_LENGTH * MAGNIFICATION / FSTOP;
    const PPM_DIVISOR = 35;
    
    // Render target for horizontal blurr pass.
    let hblurTexture = device.createTexture({
        label: 'dof hblur texture',
        size: [canvas.width, canvas.height],
        format: presentationFormat,
        usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING,
    });


    // Sampling direction for each pass.
    const dofHorizontalUniformBuffer = device.createBuffer({
        label: "dof horizontal uniforms",
        size: 8,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
    });

    device.queue.writeBuffer(
        dofHorizontalUniformBuffer, 0, 
        new Float32Array([
            1.0, 0.0,
        ])
    );

    const dofVerticalUniformBuffer = device.createBuffer({
        label: "dof vertical uniforms",
        size: 8,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
    });

    device.queue.writeBuffer(
        dofVerticalUniformBuffer, 0, 
        new Float32Array([
            0.0, 1.0,
        ])
    );

    // Uniforms related to canvas size.
    const resolutionData = new Float32Array([
        canvas.width,
        canvas.height,
        Math.sqrt(canvas.width * canvas.width + canvas.height * canvas.height) / PPM_DIVISOR
    ]);

    const resolutionUniformBuffer = device.createBuffer({
        label: "dof resolution uniforms",
        size: 16,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
    });

    device.queue.writeBuffer(resolutionUniformBuffer, 0, resolutionData);

    // General DOF parameters.
    const dofUniformBuffer = device.createBuffer({
        label: "dof uniforms",
        size: 8,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
    });

    device.queue.writeBuffer(
        dofUniformBuffer, 0, 
        new Float32Array([
            FOCUS_DISTANCE,
            BLUR_COEFFICIENT,
        ])
    );
    
    const dofShaderModule = device.createShaderModule({
        code: `

            const MAX_BLUR: f32 = 10.0;

            @vertex
            fn vs(@location(0) position: vec4f) -> @builtin(position) vec4f {
                return position;
            }


            struct DirectionUniforms {
                sampleDirection: vec2f
            };

            struct ResolutionUniforms {
                resolution: vec2f,
                ppm: f32
            };

            struct DOFUniforms {
                focusDistance: f32,
                blurCoefficient: f32,
                
            };

            @group(0) @binding(0) var<uniform> directionUniforms: DirectionUniforms;
            @group(0) @binding(1) var colorTexture: texture_2d<f32>;

            @group(1) @binding(0) var<uniform> resolutionUniforms: ResolutionUniforms;
            @group(1) @binding(1) var<uniform> dofUniforms: DOFUniforms;
            @group(1) @binding(2) var depthTexture: texture_2d<f32>;

            @fragment
            fn fs(
                @builtin(position) fragmentPosition: vec4f, 
            ) -> @location(0) vec4f {
                let canvasPosition = vec2i(fragmentPosition.xy);

                let depth = textureLoad(depthTexture, canvasPosition, 0).r;
                let deltaDepth = abs(dofUniforms.focusDistance - depth);
                let xdd = select(abs(dofUniforms.focusDistance + deltaDepth), abs(dofUniforms.focusDistance - deltaDepth), depth < dofUniforms.focusDistance);
                let blurRadius = min(floor(dofUniforms.blurCoefficient * (deltaDepth / xdd) * resolutionUniforms.ppm), MAX_BLUR);
                let maxCoord = vec2i(resolutionUniforms.resolution - 1.0);

                var color = vec4f(0.0);

                if (blurRadius > 1.0) {
                    let halfBlur = blurRadius * 0.5;

                    var count: f32 = 0.0;

                    for (var i: f32 = 0.0; i <= MAX_BLUR; i += 1.0) {
                        if (i > blurRadius) {
                            break;
                        }

                        // texelFetch outside texture gives vec4(0.0) (undefined in ES 3)
                        let sampleCoord = clamp(canvasPosition + vec2i(((i - halfBlur) * directionUniforms.sampleDirection)), vec2i(0), maxCoord);
                        color += textureLoad(colorTexture, sampleCoord, 0);

                        count += 1.0;
                    }

                    color /= count;
                } else {
                    color = textureLoad(colorTexture, canvasPosition, 0);
                }

                return color;
            }

        `
    });

    const dofPipeline = device.createRenderPipeline({
        label: 'dof pipeline',
        layout: 'auto',
        vertex: {
            module: dofShaderModule,
            entryPoint: "vs",
            buffers: [
                {
                    arrayStride: 8,
                    attributes: [{
                        shaderLocation: 0,
                        format: "float32x2",
                        offset: 0
                    }]
                },
            ]
        },
        fragment: {
            module: dofShaderModule,
            entryPoint: "fs",
            targets: [{
                format: presentationFormat,
            }],
        },
        primitive: {
            topology: "triangle-strip",
            cullMode: "back"
        }
    });

    // Bind groups for uniforms specfic to each dof pass:
    // sampling direction and color input texture.
    let dofHorizontalBindGroup = device.createBindGroup({
        layout: dofPipeline.getBindGroupLayout(0),
        entries: [
            {
                binding: 0,
                resource: {
                    buffer: dofHorizontalUniformBuffer
                }
            },
            {
                binding: 1,
                resource: colorResolveTexture.createView()
            },

        ]
    });

    let dofVerticalBindGroup = device.createBindGroup({
        layout: dofPipeline.getBindGroupLayout(0),
        entries: [
            {
                binding: 0,
                resource: {
                    buffer: dofVerticalUniformBuffer
                }
            },
            {
                binding: 1,
                resource: hblurTexture.createView()
            },

        ]
    });

    // Uniforms shared by both passes.
    let dofBindGroup = device.createBindGroup({
        layout: dofPipeline.getBindGroupLayout(1),
        entries: [
            {
                binding: 0,
                resource: {
                    buffer: resolutionUniformBuffer
                }
            },
            {
                binding: 1,
                resource: {
                    buffer: dofUniformBuffer
                }
            },
            {
                binding: 2,
                resource: linearDepthResolveTexture.createView()
            }

        ]
    });

    ////////////
    // Objects
    ////////////
    const boxes = new Array(NUM_BOXES).fill(null).map((_, i) => {

        const drawUniformBuffer = device.createBuffer({
            size: 64,
            usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
        });

        const drawBindGroup = device.createBindGroup({
            layout: drawPipeline.getBindGroupLayout(0),
            entries: [
                {
                    binding: 0,
                    resource: {
                        buffer: sceneUniformBuffer
                    }
                },
                {
                    binding: 1,
                    resource: {
                        buffer: drawUniformBuffer
                    }
                },
                {
                    binding: 2,
                    resource: sampler
                },
                {
                    binding: 3,
                    resource: texture.createView()
                }

            ]
        });

        const row = Math.floor(i / BOXES_PER_ROW);
        const col = i % BOXES_PER_ROW;
        const SPACING = 1.5;

        return {
            translate: [(-BOXES_PER_ROW * 0.4 + col) * SPACING, 0, -row * SPACING],
            rotate: [
                randomRange(0, 2 * Math.PI),
                randomRange(0, 2 * Math.PI),
                randomRange(0, 2 * Math.PI) 
            ],
            modelMatrix: mat4.create(),
            drawUniformBuffer,
            drawBindGroup
        };
    });

    ///////////////////////////
    // Render pass description
    ///////////////////////////

    // MSAA draw pass resolves for postprocessing.
    // Also outputs linear depth from the shader 
    // so it can be resolved and used in postprocessing.
    const drawRenderPassDescription = {
        colorAttachments: [
            {
                view: msaaTexture.createView(),
                resolveTarget: colorResolveTexture.createView(),
                loadOp: "clear",
                storeOp: "store",
                clearValue: [0, 0, 0, 1]
            },
            {
                view: linearDepthTexture.createView(),
                resolveTarget: linearDepthResolveTexture.createView(),
                loadOp: "clear",
                storeOp: "store",
                clearValue: [0, 0, 0, 0]
            }
        
        ],
        depthStencilAttachment: {
            view: drawDepthTexture.createView(),
            depthClearValue: 1,
            depthLoadOp: "clear",
            depthStoreOp: "store"
        },
        timestampWrites: timer.gpuPassDescriptor("draw")
    };

    const dofRenderPassDescription = {
        colorAttachments: [
            {
                view: context.getCurrentTexture().createView(),
                loadOp: "clear",
                storeOp: "store",
                clearValue: [0, 0, 0, 1]
            }
        
        ],
        timestampWrites: timer.gpuPassDescriptor("dof")
    };

    window.addEventListener("resize", () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        mat4.perspectiveZO(projectionMatrix, FOV, canvas.width / canvas.height, NEAR, FAR)
        device.queue.writeBuffer(sceneUniformBuffer, 64, projectionMatrix);

        resolutionData.set([
            canvas.width, 
            canvas.height, 
            Math.sqrt(canvas.width * canvas.width + canvas.height * canvas.height) / PPM_DIVISOR
        ]);
        device.queue.writeBuffer(resolutionUniformBuffer, 0, resolutionData);

        msaaTexture.destroy();
        msaaTexture = device.createTexture({
            label: 'msaa texture',
            size: [canvas.width, canvas.height],
            format: "rgba8unorm",
            usage: GPUTextureUsage.RENDER_ATTACHMENT,
            sampleCount: 4
        });
        colorResolveTexture.destroy();
        colorResolveTexture = device.createTexture({
            label: 'color resolve texture',
            size: [canvas.width, canvas.height],
            format: "rgba8unorm",
            usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING,
        });
        linearDepthTexture.destroy();
        linearDepthTexture = device.createTexture({
            label: 'linear depth texture',
            size: [canvas.width, canvas.height],
            format: "r16float",
            usage: GPUTextureUsage.RENDER_ATTACHMENT,
            sampleCount: 4
        });

        linearDepthResolveTexture.destroy();
        linearDepthResolveTexture = device.createTexture({
            label: 'linear depth resolve texture',
            size: [canvas.width, canvas.height],
            format: "r16float",
            usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING,
        });

        drawDepthTexture.destroy();
        drawDepthTexture = device.createTexture({
            size: [canvas.width, canvas.height],
            format: "depth24plus",
            usage:  GPUTextureUsage.RENDER_ATTACHMENT,
            sampleCount: 4
        });
        hblurTexture.destroy();
        hblurTexture = device.createTexture({
            label: 'dof hblur texture',
            size: [canvas.width, canvas.height],
            format: presentationFormat,
            usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING,
        });

        drawRenderPassDescription.colorAttachments[0].view = msaaTexture.createView();
        drawRenderPassDescription.colorAttachments[0].resolveTarget = colorResolveTexture.createView();
        drawRenderPassDescription.colorAttachments[1].view = linearDepthTexture.createView();
        drawRenderPassDescription.colorAttachments[1].resolveTarget = linearDepthResolveTexture.createView();
        drawRenderPassDescription.depthStencilAttachment.view = drawDepthTexture.createView();
        dofRenderPassDescription.colorAttachments[0].view = hblurTexture.createView();

        dofHorizontalBindGroup = device.createBindGroup({
            layout: dofPipeline.getBindGroupLayout(0),
            entries: [
                {
                    binding: 0,
                    resource: {
                        buffer: dofHorizontalUniformBuffer
                    }
                },
                {
                    binding: 1,
                    resource: colorResolveTexture.createView()
                },

            ]
        });
        dofVerticalBindGroup = device.createBindGroup({
            layout: dofPipeline.getBindGroupLayout(0),
            entries: [
                {
                    binding: 0,
                    resource: {
                        buffer: dofVerticalUniformBuffer
                    }
                },
                {
                    binding: 1,
                    resource: hblurTexture.createView()
                },

            ]
        });
        dofBindGroup = device.createBindGroup({
            layout: dofPipeline.getBindGroupLayout(1),
            entries: [
                {
                    binding: 0,
                    resource: {
                        buffer: resolutionUniformBuffer
                    }
                },
                {
                    binding: 1,
                    resource: {
                        buffer: dofUniformBuffer
                    }
                },
                {
                    binding: 2,
                    resource: linearDepthResolveTexture.createView()
                }

            ]
        });
    });
        

    let lastTime;
    function draw(time) {
        timer.cpuTimeStart("frame");

        lastTime = lastTime ?? time;
        const dt = time - lastTime;
        lastTime = time;

        for (const box of boxes) {
            box.rotate[0] += 0.001 * dt;
            box.rotate[1] += 0.002 * dt;

            xformMatrix(box.modelMatrix, box.translate, box.rotate, box.scale);
            
            device.queue.writeBuffer(box.drawUniformBuffer, 0, box.modelMatrix);
        }

        ///////////
        // Draw
        ///////////

        const commandEncoder = device.createCommandEncoder();
        const renderPass = commandEncoder.beginRenderPass(drawRenderPassDescription);

        renderPass.setPipeline(drawPipeline);
        renderPass.setVertexBuffer(0, positionBuffer);
        renderPass.setVertexBuffer(1, normalBuffer);
        renderPass.setVertexBuffer(2, uvBuffer);

        for (const box of boxes) {
            renderPass.setBindGroup(0, box.drawBindGroup);
            renderPass.draw(numVertices);           
        }

        renderPass.end();


        //////////////////////////////////////////////
        // DOF as 2-pass separable blur
        // The only change between passes is the 
        // render target and the first bind group.
        //////////////////////////////////////////////

        dofRenderPassDescription.colorAttachments[0].view = hblurTexture.createView();

        const dofHBlurRenderPass = commandEncoder.beginRenderPass(dofRenderPassDescription);

        dofHBlurRenderPass.setPipeline(dofPipeline);
        dofHBlurRenderPass.setVertexBuffer(0, quad.positions);
        dofHBlurRenderPass.setBindGroup(0, dofHorizontalBindGroup);
        dofHBlurRenderPass.setBindGroup(1, dofBindGroup);
        dofHBlurRenderPass.draw(quad.count);           
        dofHBlurRenderPass.end();

        dofRenderPassDescription.colorAttachments[0].view = context.getCurrentTexture().createView();

        const dofVBlurRenderPass = commandEncoder.beginRenderPass(dofRenderPassDescription);

        dofVBlurRenderPass.setPipeline(dofPipeline);
        dofVBlurRenderPass.setVertexBuffer(0, quad.positions);
        dofVBlurRenderPass.setBindGroup(0, dofVerticalBindGroup);
        dofVBlurRenderPass.setBindGroup(1, dofBindGroup);
        dofVBlurRenderPass.draw(quad.count);           
        dofVBlurRenderPass.end();

        timer.gpuBeforeSubmit(commandEncoder);
        device.queue.submit([commandEncoder.finish()]);
        timer.gpuAfterSubmit();
        timer.cpuTimeEnd("frame");

        cpuTimeDisplay.innerText = `${timer.cpuTimes["frame"].toFixed(2)}ms`;
        drawTimeDisplay.innerText = timer.hasGPUTimer ? `${timer.gpuTimes["draw"].toFixed(2)}ms` : "N/A";
        dofTimeDisplay.innerText = timer.hasGPUTimer ? `${timer.gpuTimes["dof"].toFixed(2)}ms` : "N/A";

        requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
        
})();

</script>
